# Sincronizacion automatica con Gumroad (gratis en GitHub Actions).
# Se activa cuando existe el secreto GUMROAD_ACCESS_TOKEN en el repositorio.
# - Cada dia a las 06:00 UTC
# - Manualmente: pestana Actions -> "Sync Gumroad products" -> Run workflow
name: Sync Gumroad products

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar productos de Gumroad
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: python tools/sync_gumroad.py
      - name: Regenerar sitemap
        run: python tools/build_sitemap.py
      - name: Guardar cambios
        run: |
          git config user.name "plugsaurus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/gumroad-sync.json sitemap.xml robots.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Sync Gumroad products" && git push)
